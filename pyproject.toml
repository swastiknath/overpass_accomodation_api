[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotels-api"
version = "1.0.0"
description = "Comprehensive Real-time Hotel Data Listing API & Large-Scale Ingestion Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "aiohttp>=3.9.0",
    "pyarrow>=15.0.0",
    "rapidfuzz>=3.6.0"
]
